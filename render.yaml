# Render Blueprint for a small free-tier demonstration deployment.
#
# Free-tier caveats:
# - the web services sleep after 15 minutes without traffic;
# - the free Postgres database expires after 30 days and has no backups;
# - free Key Value is in-memory and may lose data after a restart;
# - uploads remain on the backend's ephemeral filesystem.
#
# If you change either service name, update the public URLs below too.

services:
  - type: web
    name: chattermate-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.backend.prod
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chattermate-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: chattermate-db
          property: connectionString
      - key: BACKEND_URL
        value: https://chattermate-api.onrender.com
      - key: FRONTEND_URL
        value: https://chattermate-web.onrender.com
      - key: VITE_WIDGET_URL
        value: https://chattermate-api.onrender.com
      - key: CORS_ORIGINS
        value: '["https://chattermate-web.onrender.com"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CONVERSATION_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: S3_FILE_STORAGE
        value: "false"
      - key: PRELOAD_MODELS
        value: "false"

  - type: web
    name: chattermate-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: VITE_API_URL
        value: https://chattermate-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://chattermate-api.onrender.com
      - key: VITE_WIDGET_URL
        value: https://chattermate-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: chattermate-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: chattermate-db
    plan: free
    region: oregon
    databaseName: chattermate
    user: chattermate
